name: Publicar Mi Banda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4
      - name: Preparar el sitio
        run: |
          mkdir -p sitio
          cp index.html sitio/index.html
          touch sitio/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir archivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: sitio
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
