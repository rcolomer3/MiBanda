name: Publicar BandApp

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar sitio e iconos
        run: |
          python -m pip install --quiet Pillow
          mkdir -p sitio
          cp index.html firebase-sync.js site.webmanifest sitio/
          python scripts/generate_icons.py
          touch sitio/.nojekyll
          for file in index.html firebase-sync.js site.webmanifest favicon.png apple-touch-icon.png icon-192.png icon-512.png; do
            test -s "sitio/$file"
          done
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir archivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: sitio
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
